[project]
name = "polybot"
version = "0.1.0"
description = "Polymarket weather arbitrage bot comparing NOAA + Open-Meteo forecasts with market prices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "py-clob-client>=0.5.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "click>=8.1",
    "alembic>=1.13",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.3.0",
]

[project.scripts]
polybot = "polybot.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pytest-asyncio]
mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.coverage.run]
source = ["src/polybot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polybot"]
